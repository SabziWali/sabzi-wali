<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Taza Vegetables — Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #1F2E22;
    --bg-secondary: #26392A;
    --bg-card: #26392A;
    --bg-input: #1F2E22;
    --bg-hero: #2e5d34;
    --text-primary: #F4EFE3;
    --text-secondary: #D8E3D3;
    --text-muted: #9FB29B;
    --border-color: #3C5540;
    --border-light: #4C6A4F;
    --accent: #E8A33D;
    --shadow: rgba(0,0,0,0.35);
    --card-shadow: 0 12px 30px rgba(0,0,0,0.35);
    --body-bg: linear-gradient(rgba(31,46,34,0.94), rgba(31,46,34,0.98));
    --chart-bg: #26392A;
  }

  [data-theme="light"] {
    --bg-primary: #f5f0e8;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-input: #f5f0e8;
    --bg-hero: #d4e8d0;
    --text-primary: #1F2E22;
    --text-secondary: #2d4332;
    --text-muted: #5a7a5e;
    --border-color: #c5d5c0;
    --border-light: #a8c0a0;
    --accent: #d4892a;
    --shadow: rgba(0,0,0,0.15);
    --card-shadow: 0 12px 30px rgba(0,0,0,0.1);
    --body-bg: linear-gradient(rgba(245,240,232,0.94), rgba(245,240,232,0.98));
    --chart-bg: #ffffff;
  }

  html, body {
    font-family: "Segoe UI", "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", Tahoma, Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }

  body {
    background-image: var(--body-bg);
    padding-bottom: 90px;
  }

  .theme-toggle {
    position: fixed;
    bottom: 70px;
    right: 14px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 2px solid var(--accent);
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    z-index: 49;
    box-shadow: 0 2px 10px var(--shadow);
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-toggle:hover {
    background: var(--accent);
    color: var(--bg-primary);
  }

  header {
    padding: 22px 18px 18px;
    text-align: center;
    border-bottom: 3px dashed var(--border-light);
    position: relative;
  }
  header .eyebrow {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    font-family: Tahoma, Arial, sans-serif;
    margin-bottom: 6px;
  }
  header h1 { font-size: 30px; font-weight: 800; color: var(--text-primary); text-shadow: 0 0 14px rgba(232,163,61,0.25); }
  header p.tag { margin-top: 6px; font-size: 13px; color: var(--text-muted); font-family: Tahoma, Arial, sans-serif; }
  header .chalk-line { display:inline-block; width: 60px; height: 3px; background: var(--accent); border-radius: 2px; margin-top: 12px; opacity: 0.8; }

  .hero {
    background: linear-gradient(135deg, var(--bg-hero), var(--bg-primary));
    margin: 15px;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    border: 2px solid var(--border-color);
    box-shadow: 0 10px 25px var(--shadow);
    transition: background 0.3s;
  }

  .hero h2 {
    font-size: 28px;
    color: var(--text-primary);
    margin: 10px 0;
  }

  .hero p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 15px;
  }

  .offer-badge {
    display: inline-block;
    background: var(--accent);
    color: var(--bg-primary);
    padding: 8px 18px;
    border-radius: 30px;
    font-weight: bold;
    margin-bottom: 15px;
  }

  .search-box input {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    outline: none;
    font-size: 16px;
    background: var(--bg-input);
    color: var(--text-primary);
  }

  .today-special {
    background: linear-gradient(135deg, var(--accent), #d4892a);
    margin: 10px 15px;
    padding: 14px 20px;
    border-radius: 14px;
    text-align: center;
    color: var(--bg-primary);
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 4px 15px rgba(232,163,61,0.3);
    animation: pulse-banner 2s infinite;
  }
  .today-special span {
    display: inline-block;
    animation: bounce-emoji 1.5s infinite;
  }
  @keyframes pulse-banner {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  @keyframes bounce-emoji {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 14px 6px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--border-color); background: transparent; color: var(--text-secondary); font-size: 13.5px; font-family: Tahoma, Arial, sans-serif; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--bg-primary); }
  .tab.featured { border-color: var(--accent); color: var(--accent); }

  main { padding: 8px 14px 10px; min-height: 200px; }

  .cat-heading { 
    font-size: 18px; 
    font-weight: 700; 
    color: var(--accent); 
    margin-top: 30px; 
    margin-bottom: 10px; 
    font-family: Tahoma, Arial, sans-serif; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
  }
  .cat-heading::after { content: ""; flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--border-color) 0 6px, transparent 6px 12px); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  .card { 
    background: var(--bg-card); 
    border: 1px solid var(--border-color); 
    border-radius: 14px; 
    padding: 12px; 
    display: flex; 
    flex-direction: column; 
    gap: 6px; 
    position: relative; 
    overflow: hidden; 
    transition: .3s; 
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--card-shadow);
  }
  .card.in-cart { border-color: var(--accent); }
  .card.featured-card { border-color: var(--accent); border-width: 2px; }

  .card .thumb { 
    width: 100%; 
    height: 140px; 
    border-radius: 14px; 
    overflow: hidden; 
    background: var(--bg-input); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    margin-bottom: 8px; 
  }
  .card .thumb img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    transition: .4s; 
  }
  .card:hover .thumb img {
    transform: scale(1.08);
  }
  .card .thumb .icon-fallback { font-size: 30px; }

  .card .name { font-size: 14px; font-weight: 700; color: var(--text-primary); min-height: 36px; line-height: 1.3; }
  .card .weight { font-size: 11.5px; color: var(--text-muted); font-family: Tahoma, Arial, sans-serif; }

  .card .price { 
    font-size: 20px !important; 
    font-weight: 800; 
    color: var(--accent); 
    font-family: Tahoma, Arial, sans-serif; 
    margin-top: 2px; 
  }

  .fresh-tag {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #25D366;
    color: #fff;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
  }

  .offer-tag {
    position: absolute;
    top: 10px;
    right: -30px;
    background: #E53935;
    color: #fff;
    padding: 5px 40px;
    transform: rotate(45deg);
    font-size: 10px;
    font-weight: bold;
    z-index: 2;
  }

  .sale-badge {
    position: absolute;
    bottom: 60px;
    right: 8px;
    background: #E53935;
    color: #fff;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: bold;
    z-index: 2;
    animation: pulse-banner 1.5s infinite;
  }

  .wish-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 22px;
    cursor: pointer;
    z-index: 3;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }
  .wish-btn:hover {
    transform: scale(1.2);
  }

  .featured {
    position: absolute;
    left: 10px;
    bottom: 10px;
    background: gold;
    color: #000;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
  }

  .sale-tag {
    position: absolute;
    right: 10px;
    bottom: 10px;
    background: #E53935;
    color: #fff;
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 11px;
    text-align: center;
    z-index: 2;
  }
  .sale-tag s { color: #ffcccc; }

  .qty-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }

  .add-btn { 
    width: 100%; 
    padding: 8px 0; 
    border-radius: 8px; 
    border: none; 
    background: #25D366; 
    color: #fff; 
    font-weight: 700; 
    font-size: 13px; 
    cursor: pointer; 
    font-family: Tahoma, Arial, sans-serif; 
    transition: .3s; 
  }
  .add-btn:hover { background: #1eb85a; }

  .stepper { display: flex; align-items: center; justify-content: space-between; background: var(--border-color); border-radius: 8px; overflow: hidden; width: 100%; }
  .stepper button { 
    background: var(--accent); 
    border: none; 
    color: var(--bg-primary); 
    font-size: 17px; 
    font-weight: 900; 
    width: 34px; 
    height: 32px; 
    cursor: pointer; 
    transition: .2s; 
  }
  .stepper button:hover { transform: scale(1.1); }
  .stepper .qty-val { flex: 1; text-align: center; font-weight: 800; font-size: 14px; color: var(--text-primary); font-family: Tahoma, Arial, sans-serif; }

  .cart-bar { position: fixed; bottom: 14px; left: 14px; right: 14px; background: var(--accent); color: var(--bg-primary); border-radius: 14px; padding: 13px 16px; display: none; align-items: center; justify-content: space-between; font-family: Tahoma, Arial, sans-serif; font-weight: 800; box-shadow: 0 8px 24px var(--shadow); cursor: pointer; z-index: 50; }
  .cart-bar.show { display: flex; }
  .cart-bar .count-badge { background: var(--bg-primary); color: var(--accent); width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; margin-left: 8px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 100; }
  .overlay.show { display: block; }
  .drawer { position: fixed; bottom: 0; left: 0; right: 0; max-height: 88vh; background: var(--bg-secondary); border-radius: 20px 20px 0 0; padding: 18px 18px 20px; transform: translateY(100%); transition: transform .25s ease; z-index: 101; overflow-y: auto; }
  .drawer.show { transform: translateY(0); }
  .drawer-handle { width: 40px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 0 auto 14px; }
  .drawer h2 { font-size: 18px; color: var(--accent); margin-bottom: 14px; font-family: Tahoma, Arial, sans-serif; }
  .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
  .cart-item .ci-name { font-size: 13.5px; font-weight: 700; color: var(--text-primary); }
  .cart-item .ci-sub { font-size: 11.5px; color: var(--text-muted); font-family: Tahoma, Arial, sans-serif; }
  .cart-item .ci-right { display:flex; align-items:center; gap:10px; }
  .cart-item .ci-price { font-size: 13px; color: var(--accent); font-weight: 800; font-family: Tahoma, Arial, sans-serif; min-width: 70px; text-align: left; }

  .empty-cart { text-align: center; color: var(--text-muted); padding: 30px 0; font-family: Tahoma, Arial, sans-serif; font-size: 13.5px; }

  .sub-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; color: var(--text-secondary); font-family: Tahoma, Arial, sans-serif; }
  .total-row { display: flex; justify-content: space-between; padding: 10px 0 6px; margin-top: 4px; border-top: 1px dashed var(--border-color); font-size: 16px; font-weight: 800; color: var(--text-primary); font-family: Tahoma, Arial, sans-serif; }
  .total-row span.amt { color: var(--accent); }

  .field { margin-top: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 5px; font-family: Tahoma, Arial, sans-serif; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); font-size: 14px; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 56px; }

  .checkout-btn { width: 100%; margin-top: 18px; padding: 14px 0; border: none; border-radius: 12px; background: #25D366; color: #0A2A17; font-weight: 800; font-size: 15.5px; cursor: pointer; font-family: Tahoma, Arial, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .checkout-btn:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }
  .close-drawer { position: absolute; top: 16px; left: 16px; background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
  .hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 10px; font-family: Tahoma, Arial, sans-serif; }

  .admin-fab {
    position: fixed; bottom: 14px; left: 14px;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--bg-card); border: 2px solid var(--accent);
    color: var(--accent); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 49;
    box-shadow: 0 2px 10px var(--shadow);
    transition: 0.2s;
  }
  .admin-fab:hover { background: var(--accent); color: var(--bg-primary); }

  .admin-drawer { position: fixed; inset: 0; background: var(--bg-primary); z-index: 200; display: none; flex-direction: column; }
  .admin-drawer.show { display: flex; }

  .admin-top { 
    padding: 16px 18px; 
    border-bottom: 2px dashed var(--border-color); 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    background: linear-gradient(90deg, #2e7d32, var(--bg-primary));
  }
  .admin-top h2 { font-size: 17px; color: var(--accent); font-family: Tahoma, Arial, sans-serif; }
  .admin-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .admin-login { max-width: 320px; margin: 60px auto; text-align:center; }
  .admin-login p { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; font-family: Tahoma, Arial, sans-serif; }
  .admin-btn { padding: 10px 20px; border-radius: 9px; border: none; background: var(--accent); color: var(--bg-primary); font-weight: 800; cursor: pointer; font-family: Tahoma, Arial, sans-serif; font-size: 13.5px; margin: 5px; transition: 0.2s; }
  .admin-btn:hover { opacity: 0.9; transform: scale(1.02); }
  .admin-btn.secondary { background: #2196F3; color: #fff; }
  .admin-btn.secondary:hover { background: #1976D2; }
  .admin-btn.danger { background: #7A3B2E; color: #fff; }
  .admin-btn.success { background: #25D366; color: #fff; }
  .admin-btn.success:hover { background: #1eb85a; }
  .admin-btn.info { background: #4C6A4F; color: #fff; }
  .admin-btn.purple { background: #7B1FA2; color: #fff; }
  .admin-btn.warning { background: #FF9800; color: #fff; }
  .admin-section-title { font-size: 14px; font-weight: 800; color: var(--accent); margin: 20px 0 10px; font-family: Tahoma, Arial, sans-serif; }

  .admin-product-row { 
    background: var(--bg-card); 
    border: 1px solid var(--border-color); 
    border-radius: 10px; 
    padding: 10px 12px; 
    margin-bottom: 8px; 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    transition: .25s; 
  }
  .admin-product-row:hover { transform: translateX(5px); border-color: var(--accent); }
  .admin-product-row .ap-thumb { width: 40px; height: 40px; border-radius: 8px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; flex-shrink: 0; }
  .admin-product-row .ap-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .admin-product-row .ap-info { flex: 1; font-family: Tahoma, Arial, sans-serif; }
  .admin-product-row .ap-name { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .admin-product-row .ap-meta { font-size: 11px; color: var(--text-muted); }
  .admin-product-row .ap-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .icon-btn { 
    width: 30px; 
    height: 30px; 
    border-radius: 6px; 
    border: 1px solid var(--border-color); 
    background: var(--bg-input); 
    color: var(--text-secondary); 
    cursor: pointer; 
    font-size: 14px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    transition: .25s; 
    margin-left: 4px;
  }
  .icon-btn:hover { background: var(--accent); color: var(--bg-primary); }

  .status-msg { font-size: 12px; color: #7CB342; margin-top: 8px; text-align: center; font-family: Tahoma, Arial, sans-serif; min-height: 16px; }
  .status-msg.err { color: #E07A5F; }
  select.field-input { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); font-size: 14px; font-family: inherit; }
  .loading-msg { text-align: center; color: var(--text-muted); padding: 40px 0; font-family: Tahoma, Arial, sans-serif; font-size: 13px; }

  .stat-boxes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-box {
    background: var(--bg-card);
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid var(--border-color);
    transition: .25s;
    cursor: pointer;
  }
  .stat-box:hover {
    transform: translateY(-6px);
    box-shadow: var(--card-shadow);
  }

  .stat-box h3 {
    font-size: 26px;
    color: var(--accent);
  }

  .stat-box p {
    margin-top: 5px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .no-results { text-align: center; color: var(--text-muted); padding: 40px 0; font-family: Tahoma, Arial, sans-serif; font-size: 14px; }

  #imgPreview {
    box-shadow: 0 10px 25px var(--shadow);
    transition: .3s;
  }
  #imgPreview:hover { transform: scale(1.05); }

  #epPreview {
    border: 2px solid var(--border-color);
    box-shadow: 0 8px 20px var(--shadow);
    margin-bottom: 15px;
  }
  #epPreview:hover { transform: scale(1.05); transition: .3s; }

  .status-badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-top: 4px;
  }
  .status-pending { background: var(--accent); color: var(--bg-primary); }
  .status-completed { background: #25D366; color: #0A2A17; }
  .status-cancelled { background: #E53935; color: #fff; }

  .notify-box {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #25D366;
    color: #fff;
    padding: 15px 25px;
    border-radius: 12px;
    font-weight: bold;
    z-index: 9999;
    opacity: 0;
    transform: translateY(-30px);
    transition: .4s;
    box-shadow: 0 8px 30px var(--shadow);
    max-width: 300px;
  }
  .notify-box.show { opacity: 1; transform: translateY(0); }
  .notify-box.error { background: #E53935; }

  .delivery-status {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0;
  }
  .delivery-status .status-item {
    background: var(--bg-card);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    flex: 1;
    text-align: center;
    min-width: 80px;
  }
  .delivery-status .status-item .label {
    font-size: 10px;
    color: var(--text-muted);
  }
  .delivery-status .status-item .value {
    font-size: 16px;
    font-weight: 800;
    color: var(--accent);
  }
  .delivery-status .status-item.active {
    border-color: var(--accent);
    background: var(--bg-primary);
  }

  .admin-search {
    margin-bottom: 15px;
  }
  .admin-search input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--border-color);
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
  }
  .admin-search input:focus {
    border-color: var(--accent);
    outline: none;
  }

  .chart-container {
    background: var(--chart-bg);
    border-radius: 12px;
    padding: 15px;
    border: 1px solid var(--border-color);
    margin-bottom: 15px;
    overflow-x: auto;
  }
  .chart-container canvas {
    max-width: 100%;
    height: auto;
  }

  .inv-low {
    color: #E53935;
  }
  .inv-medium {
    color: var(--accent);
  }
  .inv-high {
    color: #25D366;
  }

  .progress-bar {
    background: var(--border-color);
    border-radius: 20px;
    height: 14px;
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-bar .fill {
    height: 100%;
    border-radius: 20px;
    transition: width 1s ease;
  }
  .progress-bar .fill.green { background: #25D366; }
  .progress-bar .fill.orange { background: #FF9800; }
  .progress-bar .fill.blue { background: #2196F3; }
  .progress-bar .fill.red { background: #E53935; }
  .progress-bar .fill.gold { background: #FFD700; }

  .stat-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 8px;
  }

  .light .progress-bar {
    background: #e0e0e0;
  }
  .light .stat-label {
    color: #555;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .stat-boxes { grid-template-columns: repeat(2, 1fr); }
    .hero h2 { font-size: 22px; }
    header h1 { font-size: 24px; }
    .admin-btn { font-size: 12px; padding: 8px 14px; }
  }
</style>
</head>
